
          <div class="form-grid">
            <div class="field"><label for="nhu-cau-1">1. Ai sẽ sống trong nhà? Bao nhiêu tuổi?</label><textarea class="need-q" id="nhu-cau-1" placeholder="Ví dụ nhà chị Hạnh: vợ chồng, bé Na 7 tuổi, bà nội 74 tuổi. Có thể đón thêm em bé."></textarea></div>
            <div class="field"><label for="nhu-cau-2">2. Một ngày bình thường của nhà mình diễn ra thế nào?</label><textarea class="need-q" id="nhu-cau-2" placeholder="Bà dậy sớm nhất, nấu cơm. Anh Tùng đi làm bằng xe máy, cần chỗ để xe. Tối cả nhà ăn cơm ở bếp."></textarea></div>
            <div class="field"><label for="nhu-cau-3">3. Ở nhà mới, mỗi người muốn làm gì nhất? (Hỏi cả trẻ con.)</label><textarea class="need-q" id="nhu-cau-3" placeholder="Na: chạy lên chạy xuống gặp cả nhà, ngắm con mèo. Bà: ngồi gần bếp. Chị Hạnh: một góc để sách."></textarea></div>
            <div class="field"><label for="nhu-cau-4">4. Ai cần đi lại nhẹ nhàng?</label><textarea class="need-q" id="nhu-cau-4" placeholder="Bà đi cầu thang mỏi chân, nên ở tầng một."></textarea></div>
            <div class="field"><label for="nhu-cau-5">5. Mười năm nữa nhà mình sẽ khác đi thế nào?</label><textarea class="need-q" id="nhu-cau-5" placeholder="Na lớn, cần phòng riêng. Có thể cho thuê tầng một."></textarea></div>
            <div class="tool-actions">
              <button class="btn btn-solid" type="button" id="copy-needs">Sao chép bản mô tả</button>
              <button class="btn" type="button" id="clear-needs">Xoá câu trả lời</button>
              <p class="status" id="needs-status" aria-live="polite"></p>
            </div>
            <div class="field" id="needs-out-wrap" hidden><label for="nhu-cau-out">Bản mô tả của bạn</label><textarea id="nhu-cau-out" readonly rows="8"></textarea></div>
