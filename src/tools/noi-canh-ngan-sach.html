
          <div class="budget">
            <div class="budget-inputs">
              <div class="field span"><label for="tien-co">Số tiền nhà mình có (triệu đồng)</label><input id="tien-co" type="number" inputmode="decimal" min="0" step="10" value="1200"></div>
              <h4>Phần xây</h4>
              <div class="field"><label for="dien-tich">Diện tích sàn (m²)</label><input id="dien-tich" type="number" inputmode="decimal" min="0" step="5" value="150"></div>
              <div class="field"><label for="don-gia">Đơn giá thợ báo (triệu/m²)</label><input id="don-gia" type="number" inputmode="decimal" min="0" step="0.1" value="5.5"></div>
              <h4>Khoản hay quên</h4>
              <div class="field"><label for="noi-that">Nội thất (triệu)</label><input id="noi-that" type="number" inputmode="decimal" min="0" step="5" value="120"></div>
              <div class="field"><label for="cong-san">Cổng rào, sân (triệu)</label><input id="cong-san" type="number" inputmode="decimal" min="0" step="5" value="40"></div>
              <div class="field span"><label for="thiet-ke">Thiết kế, giấy phép, điện nước ngoài nhà (triệu)</label><input id="thiet-ke" type="number" inputmode="decimal" min="0" step="5" value="35"></div>
              <h4>Chỗ để nêm</h4>
              <div class="field span"><label for="du-phong">Dự phòng (phần trăm của tổng chi)</label><div class="range-row"><input id="du-phong" type="range" min="0" max="20" step="1" value="10"><output id="du-phong-out" for="du-phong">10%</output></div></div>
              <p class="hint span">Đơn giá thực tế khác nhau theo địa phương, mức hoàn thiện và hình thức giao thầu. Đây chỉ là công cụ để hình dung, không phải dự toán.</p>
            </div>
            <div>
              <svg class="pot-svg" viewBox="0 0 320 290" role="img" aria-label="Nồi canh ngân sách: các khoản chi xếp chồng trong nồi">
                <defs>
                  <clipPath id="pot-clip"><path d="M58 82 H262 V228 Q262 254 236 254 H84 Q58 254 58 228 Z"/></clipPath>
                  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#D6E7EC"/><path d="M0 0V10" stroke="#8FB7C4" stroke-width="4"/></pattern>
                </defs>
                <rect x="16" y="104" width="44" height="14" rx="7" fill="#3A4560"/><rect x="260" y="104" width="44" height="14" rx="7" fill="#3A4560"/>
                <path d="M58 82 H262 V228 Q262 254 236 254 H84 Q58 254 58 228 Z" fill="#FBFBF6"/>
                <g clip-path="url(#pot-clip)">
                  <rect id="ly-build" x="58" y="254" width="204" height="0" fill="#2E7A66"/>
                  <rect id="ly-extra" x="58" y="254" width="204" height="0" fill="#E6B53C"/>
                  <rect id="ly-res" x="58" y="254" width="204" height="0" fill="url(#hatch)"/>
                  <line id="ly-top" x1="58" x2="262" y1="200" y2="200" stroke="#1E2A4C" stroke-width="2" stroke-dasharray="6 6"/>
                </g>
                <path d="M58 82 H262 V228 Q262 254 236 254 H84 Q58 254 58 228 Z" fill="none" stroke="#1E2A4C" stroke-width="3.5"/>
                <path d="M46 82 H274" stroke="#1E2A4C" stroke-width="7" stroke-linecap="round"/>
                <text id="ly-top-label" x="254" y="196" text-anchor="end" class="svg-hand" font-size="14" fill="#1E2A4C">còn trống</text>
                <g id="pot-spill" class="is-off">
                  <path d="M60 80 q-8 -16 10 -22 h180 q18 6 10 22 z" fill="#C4553B" stroke="#1E2A4C" stroke-width="2"/>
                  <g fill="#C4553B" stroke="#1E2A4C" stroke-width="1.5">
                    <path class="drip" d="M48 88 q-6 22 0 34 q6 6 8 0 q2 -14 -4 -34z"/>
                    <path class="drip" d="M272 88 q-6 22 0 34 q6 6 8 0 q2 -14 -4 -34z"/>
                  </g>
                  <text x="160" y="46" text-anchor="middle" class="svg-hand" font-size="18" fill="#C4553B">Nồi tràn!</text>
                </g>
              </svg>
              <ul class="pot-legend">
                <li><i class="sw sw-build"></i><span>Xây dựng</span><b id="lg-build"></b></li>
                <li><i class="sw sw-extra"></i><span>Khoản hay quên</span><b id="lg-extra"></b></li>
                <li><i class="sw sw-res"></i><span>Chỗ để nêm (dự phòng)</span><b id="lg-res"></b></li>
                <li class="lg-total"><i></i><span>Tổng cần</span><b id="lg-total"></b></li>
                <li><i></i><span>Nhà mình có</span><b id="lg-budget"></b></li>
              </ul>
              <p class="pot-msg" id="pot-msg" aria-live="polite"></p>
            </div>
          </div>
